  /api/v1/products:
    get:
      tags:
      - catalog
      summary: 商品列表（分页/筛选/排序）
      operationId: list_products_api_v1_products_get
      parameters:
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Category Id
      - name: store_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Store Id
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Keyword
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(created_desc|price_asc)$
          default: created_desc
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Page Size
        description: 每页条数
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PageOut_ProductOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
