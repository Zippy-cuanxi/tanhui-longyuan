openapi: 3.1.0
info:
  title: 碳惠陇原统一后端
  description: '碳惠陇原统一后端 API（/api/v1）。


    **说明**：所有业务策略参数（佣金/运费/积分/支付等）当前均为**仿真配置**，见 `.env.example` 与 `docs/pending-decisions.md`；支付渠道为
    SANDBOX Mock，未接入真实渠道。'
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 注册消费者账号
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_UserOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 登录（管理员可能要求 MFA）
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenPairOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: 刷新令牌（轮换，旧令牌作废）
      operationId: refresh_tokens_api_v1_auth_refresh_post
